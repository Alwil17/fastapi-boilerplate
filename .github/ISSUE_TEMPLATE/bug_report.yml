name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Smallest set of commands or requests that triggers it.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Include the `request_id` of the failing request. Remove secrets and tokens.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit, and how you run it (Docker, compose, uvicorn).
    validations:
      required: true
