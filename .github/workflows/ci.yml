name: CI

on:
  workflow_call: # reused by release.yml so a tag is only published after CI passes
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

# A new push supersedes the previous run on a PR; never cancel runs on master or tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt

      - name: Run Black
        run: black --check app/ tests/

      - name: Run isort
        run: isort --check-only app/ tests/

      - name: Run Ruff
        run: ruff check app/ tests/

      - name: Run MyPy
        run: mypy app/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt

      - name: Run Bandit
        run: bandit -r app/ -c pyproject.toml

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt

      - name: Run tests with coverage (PostgreSQL)
        env:
          APP_ENV: test
          DATABASE_URL: 'sqlite:///:memory:'
          TEST_DATABASE_URL: postgresql+psycopg2://test_user:test_password@localhost:5432/test_db
        run: |
          pytest --cov=app tests/ --cov-report=xml --cov-report=term --cov-fail-under=95

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: migrate_db
          POSTGRES_USER: migrate_user
          POSTGRES_PASSWORD: migrate_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg2://migrate_user:migrate_password@localhost:5432/migrate_db

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check models match migrations (no drift)
        run: alembic check

      - name: Check migrations are reversible
        run: |
          alembic downgrade base
          alembic upgrade head

  build:
    runs-on: ubuntu-latest
    needs: [lint, security, test, migrations]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: fastapi-boilerplate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image (migrations, health, non-root)
        run: docker/smoke-test.sh fastapi-boilerplate:ci

      # Pinned to a commit: this action runs with access to the built image.
      - name: Scan the image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fastapi-boilerplate:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          vuln-type: os,library
