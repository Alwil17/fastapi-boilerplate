name: CI

on:
  workflow_call: # reused by release.yml so a tag is only published after CI passes
  push:
    branches: [master, main]
  pull_request: 
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt

      - name: Run Black
        run: black --check app/ tests/

      - name: Run isort
        run: isort --check-only app/ tests/

      - name: Run Ruff
        run: ruff check app/ tests/

      # - name:  Run MyPy
      #   run: mypy app/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt

      - name: Run Bandit
        run: bandit -r app/ -c pyproject.toml

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses:  actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt

      - name: Run tests with coverage (PostgreSQL)
        env:
          APP_ENV: test
          DATABASE_URL: 'sqlite:///:memory:'
          TEST_DATABASE_URL: postgresql+psycopg2://test_user:test_password@localhost:5432/test_db
        run: |
          pytest --cov=app tests/ --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: migrate_db
          POSTGRES_USER: migrate_user
          POSTGRES_PASSWORD: migrate_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg2://migrate_user:migrate_password@localhost:5432/migrate_db

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check models match migrations (no drift)
        run: alembic check

      - name: Check migrations are reversible
        run: |
          alembic downgrade base
          alembic upgrade head

  build:
    runs-on: ubuntu-latest
    needs: [lint, security, test, migrations]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fastapi-boilerplate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image (migrations, health, non-root)
        run: docker/smoke-test.sh fastapi-boilerplate:ci
